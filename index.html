<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chroma Breach</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="game"></div>

  <div id="hud" class="hidden">
    <div id="vignette"></div>
    <div id="crosshair"><span></span><span></span><span></span><span></span><i></i></div>
    <div id="hitmarker"></div>
    <div id="boss-bar" class="hidden">
      <div class="boss-name">THE PRISM WARDEN</div>
      <div class="boss-track"><div class="boss-fill"></div><div class="boss-ghost"></div></div>
      <div class="boss-hint"></div>
    </div>
    <div id="zone-title"><div class="zone-sub"></div><div class="zone-main"></div></div>
    <div id="message"></div>
    <div id="health">
      <div class="label">INTEGRITY</div>
      <div class="track"><div class="fill"></div></div>
      <div class="value">100</div>
    </div>
    <div id="colors"></div>
    <div id="stats"><span id="secrets">SECRETS 0/0</span></div>
  </div>

  <div id="overlay">
    <div id="screen-title" class="screen">
      <h1 class="logo"><span style="--c:#ff3344">C</span><span style="--c:#ffd23a">H</span><span style="--c:#3dff7a">R</span><span style="--c:#3a8bff">O</span><span style="--c:#ff3344">M</span><span style="--c:#ffd23a">A</span> <b>BREACH</b></h1>
      <p class="tag">A color-blasting FPS puzzle platformer</p>
      <div class="buttons">
        <button data-action="play" class="primary">Play</button>
        <button data-action="settings">Settings</button>
      </div>
      <div class="controls">
        <div><kbd>WASD</kbd> move</div>
        <div><kbd>Space</kbd> jump</div>
        <div><kbd>C</kbd>/<kbd>Shift</kbd> crouch</div>
        <div><kbd>LMB</kbd> fire</div>
        <div><kbd>1-4</kbd> / <kbd>Q</kbd><kbd>E</kbd> / wheel: switch color</div>
        <div><kbd>Esc</kbd> pause</div>
      </div>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2>Paused</h2>
      <div class="buttons">
        <button data-action="resume" class="primary">Resume</button>
        <button data-action="settings">Settings</button>
        <button data-action="checkpoint">Restart from checkpoint</button>
        <button data-action="quit">Quit to title</button>
      </div>
      <p class="small" id="pause-stats"></p>
    </div>

    <div id="screen-dead" class="screen hidden">
      <h2 class="danger">Signal Lost</h2>
      <div class="buttons">
        <button data-action="respawn" class="primary">Respawn at checkpoint</button>
        <button data-action="revive" class="reward hidden">Revive here — watch an ad</button>
      </div>
    </div>

    <div id="screen-victory" class="screen hidden">
      <h2 class="win">Warden Shattered</h2>
      <p class="tag">The spectrum is yours. Demo complete.</p>
      <div id="victory-stats"></div>
      <div class="buttons"><button data-action="quit" class="primary">Back to title</button></div>
    </div>

    <div id="screen-settings" class="screen hidden">
      <h2>Settings</h2>
      <label>Mouse sensitivity <input type="range" id="set-sens" min="0.2" max="3" step="0.05" /></label>
      <label>Field of view <input type="range" id="set-fov" min="70" max="110" step="1" /></label>
      <label>Volume <input type="range" id="set-vol" min="0" max="1" step="0.05" /></label>
      <label class="check"><input type="checkbox" id="set-invert" /> Invert Y</label>
      <div class="buttons"><button data-action="settings-back" class="primary">Back</button></div>
    </div>

    <div id="screen-ad" class="screen hidden">
      <h2>One moment…</h2>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
